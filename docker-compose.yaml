version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - VITE_PUBLIC_APP_URL=http://mail.comfyspace.tech
      - VITE_PUBLIC_BACKEND_URL=http://api-mail.comfyspace.tech
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    command: ["node", "--import", "tsx", "apps/server/src/main.ts"]
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      - PORT=8787
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-zerodotemail}?sslmode=disable
      - REDIS_URL=http://upstash-proxy:8080
      - REDIS_TOKEN=${REDIS_TOKEN:-valkey}
      - REDIS_DIRECT_URL=redis://:${REDIS_TOKEN:-valkey}@valkey:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
      - S3_BUCKET=threads
      - BETTER_AUTH_SECRET=${SERVICE_BASE64_BACKEND}
      - BETTER_AUTH_URL=http://mail.comfyspace.tech
      - VITE_PUBLIC_APP_URL=http://mail.comfyspace.tech
      - VITE_PUBLIC_BACKEND_URL=http://api-mail.comfyspace.tech
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_MINI_MODEL=${OPENAI_MINI_MODEL:-gpt-4o-mini}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BETTER_AUTH_TRUSTED_ORIGINS=http://mail.comfyspace.tech,https://mail.comfyspace.tech
      - BASE_URL=http://api-mail.comfyspace.tech
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy



  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-zerodotemail}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zerodotemail}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: valkey-server --requirepass ${REDIS_TOKEN:-valkey}
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_TOKEN:-valkey}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  upstash-proxy:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=${REDIS_TOKEN:-valkey}
      - SRH_CONNECTION_STRING=redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${SERVICE_USER_MINIO} ${SERVICE_PASSWORD_MINIO};
      mc mb myminio/threads --ignore-existing;
      mc anonymous set public myminio/threads;
      exit 0;
      "
    labels:
      - "coolify.exclude_from_hc=true"

volumes:
  postgres-data:
  valkey-data:
  minio-data:
